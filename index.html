<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Magic Tome 3D</title>
<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0a0f25;
  height:100%;
  font-family:serif;
}

#bgCanvas{
  position:fixed;
  top:0;left:0;
  width:100vw;
  height:100vh;
  z-index:-2;
}

#scene{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  perspective:1600px;
}

#book{
  position:relative;
  width:420px;
  height:560px;
  transform-style:preserve-3d;
  transform-origin:center center;
  animation:float 5s ease-in-out infinite;
  cursor:pointer;
}

@keyframes float{
  0%{ transform:rotateX(8deg) rotateY(-6deg) translateY(0px); }
  50%{ transform:rotateX(12deg) rotateY(-3deg) translateY(-12px); }
  100%{ transform:rotateX(8deg) rotateY(-6deg) translateY(0px); }
}

.cover{
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  backface-visibility:hidden;
  border-radius:6px;
}

.front{
  transform:translateZ(20px);
}

.back{
  transform:rotateY(180deg) translateZ(20px);
  background:linear-gradient(#1a1a1a,#000);
}

.spine{
  position:absolute;
  width:40px;
  height:100%;
  left:-40px;
  top:0;
  background:#1f1f1f;
  transform:rotateY(90deg) translateZ(20px);
  border-radius:4px;
}

.pages{
  position:absolute;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  top:0;left:0;
}

.page{
  position:absolute;
  width:100%;
  height:100%;
  background:#f7f0e5;
  background-image:repeating-linear-gradient(#f7f0e5 0%, #f7f0e5 96%, #f0e7d6 100%);
  transform-origin:left center;
  backface-visibility:hidden;
  border-radius:4px;
  padding:40px;
  box-sizing:border-box;
  font-size:26px;
  line-height:1.4;
  color:#d9c091;
  box-shadow:0 0 8px rgba(0,0,0,0.25);
}

.page:nth-child(1){ transform:translateZ(1px); }
.page:nth-child(2){ transform:translateZ(2px); }
.page:nth-child(3){ transform:translateZ(3px); }
.page:nth-child(4){ transform:translateZ(4px); }
.page:nth-child(5){ transform:translateZ(5px); }
.page:nth-child(6){ transform:translateZ(6px); }

#closeBtn{
  position:fixed;
  bottom:50px;
  left:50%;
  transform:translateX(-50%);
  background:#ffffff10;
  border:1px solid #ffffff60;
  padding:10px 30px;
  color:#fff;
  border-radius:6px;
  backdrop-filter:blur(6px);
  cursor:pointer;
  font-size:20px;
  display:none;
}

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="scene">
  <div id="book">

    <div class="cover front" id="coverFront"></div>
    <div class="cover back"></div>
    <div class="spine"></div>

    <div class="pages">
      <div class="page p1">The Astral Record</div>
      <div class="page p2">Chapter I – A Light in the Deep</div>
      <div class="page p3">Chapter II – Signs of the Constellation</div>
      <div class="page p4">Chapter III – Bloom of Time</div>
      <div class="page p5">Chapter IV – Whispering Stars</div>
      <div class="page p6">Final Notes – The Story Has Come to an End</div>
    </div>

  </div>
</div>

<button id="closeBtn">Close Book</button>

<script>
/* ===================
   背景粒子星空
=================== */
const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let particles=[];
for(let i=0;i<150;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    s:Math.random()*2+0.5,
    vx:(Math.random()-0.5)*0.2,
    vy:(Math.random()-0.5)*0.2
  });
}

function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ffffff";
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0) p.x=canvas.width;
    if(p.y<0) p.y=canvas.height;
    if(p.x>canvas.width) p.x=0;
    if(p.y>canvas.height) p.y=0;
    ctx.globalAlpha=0.5;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ===================
   书本翻页逻辑
=================== */
let open=false;
let current=0;
const total=6;
const book=document.getElementById("book");
const pages=document.querySelectorAll(".page");
const closeBtn=document.getElementById("closeBtn");
let animating=false;

book.addEventListener("click",(e)=>{
  if(animating) return;

  if(!open){
    openBook();
  }else{
    const rect=book.getBoundingClientRect();
    const x=e.clientX-rect.left;
    if(x>rect.width/2) flipForward();
    else flipBackward();
  }
});

function openBook(){
  animating=true;
  book.style.transition="transform 1s ease";
  book.style.transform="rotateY(-25deg) rotateX(10deg) translateY(-10px)";
  setTimeout(()=>{animating=false;open=true;closeBtn.style.display='block';},1000);
}

function closeBook(){
  animating=true;
  book.style.transition="transform 1s ease";
  book.style.transform="";
  pages.forEach(p=>p.style.transform="");
  current=0;
  setTimeout(()=>{open=false;animating=false;closeBtn.style.display='none';},1000);
}

closeBtn.onclick=closeBook;

function flipForward(){
  if(current>=total-1) return;
  animating=true;
  const p=pages[current];
  p.style.transition="transform 0.9s ease";
  p.style.transform="rotateY(-180deg)";
  current++;
  setTimeout(()=>{animating=false;},900);
}

function flipBackward(){
  if(current<=0) return;
  animating=true;
  current--;
  const p=pages[current];
  p.style.transition="transform 0.9s ease";
  p.style.transform="";
  setTimeout(()=>{animating=false;},900);
}

/* ===================
   封面贴图：你的魔法书 SVG
=================== */
const coverSVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1638"/>
      <stop offset="100%" stop-color="#1c2759"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(120,200,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(80,130,210,0.5)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4e7c2"/>
      <stop offset="60%" stop-color="#c7a55d"/>
      <stop offset="100%" stop-color="#8b6c3b"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="480" cy="620" r="380" fill="url(#glow)" />
  <g fill="url(#gold)" opacity="0.85" transform="translate(80,90)">
    <rect x="0" y="0" width="800" height="80" rx="18"/>
  </g>

  <circle cx="825" cy="120" r="36" fill="url(#gold)" />
  <g transform="translate(770,1080)">
    <circle r="48" fill="url(#gold)"/>
    <circle r="32" fill="rgba(255,255,255,0.3)"/>
    <circle r="18" fill="white"/>
  </g>

  <circle cx="480" cy="640" r="310" stroke="#86c7ff" stroke-width="4" fill="none" opacity="0.7"/>
</svg>
`;

const coverDataURL = "data:image/svg+xml;base64,"+btoa(coverSVG);
document.getElementById("coverFront").style.backgroundImage=`url('${coverDataURL}')`;

</script>
</body>
</html>
